apiVersion: v1
kind: Service
metadata:
  name: cloudcrew-api
spec:
  selector: {app.kubernetes.io/name: cloudcrew-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcrew-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: cloudcrew-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudcrew-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8000"}
    spec:
      terminationGracePeriodSeconds: 75
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: cloudcrew:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - {configMapRef: {name: cloudcrew-config}}
            - {secretRef: {name: cloudcrew-secrets}}
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://agents:$(POSTGRES_PASSWORD)@postgres:5432/agents
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudcrew-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cloudcrew-api}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudcrew-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cloudcrew-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
