apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcrew-worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: cloudcrew-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudcrew-worker}
    spec:
      terminationGracePeriodSeconds: 75
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: cloudcrew:local
          imagePullPolicy: IfNotPresent
          command: [python, -m, cloud.worker]
          envFrom:
            - {configMapRef: {name: cloudcrew-config}}
            - {secretRef: {name: cloudcrew-secrets}}
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://agents:$(POSTGRES_PASSWORD)@postgres:5432/agents
          livenessProbe:
            exec: {command: [python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/tmp/worker-heartbeat').stat().st_mtime < 25"]}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudcrew-worker
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cloudcrew-worker}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
