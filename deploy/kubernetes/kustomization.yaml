apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudcrew
resources:
  - config.yaml
  - postgres.yaml
  - migrate.yaml
  - api.yaml
  - worker.yaml
  - policies.yaml
images:
  - name: cloudcrew
    newName: cloudcrew
    newTag: local
labels:
  - pairs:
      app.kubernetes.io/part-of: cloudcrew
      app.kubernetes.io/managed-by: kustomize
