apiVersion: batch/v1
kind: Job
metadata:
  name: cloudcrew-migrate
spec:
  backoffLimit: 5
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudcrew-migrate}
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: cloudcrew:local
          imagePullPolicy: IfNotPresent
          command: [python, -m, cloud.store]
          envFrom:
            - {configMapRef: {name: cloudcrew-config}}
            - {secretRef: {name: cloudcrew-secrets}}
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://agents:$(POSTGRES_PASSWORD)@postgres:5432/agents
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
