name: Cloud runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agents
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: agents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agents"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agents:ci-password@localhost:5432/agents
      AGENT_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.lock
      - run: pip install -r requirements-cloud.lock -r requirements-cloud-dev.txt
      - run: ruff check --config ruff-cloud.toml cloud shared/gemini_http.py tests/cloud scripts/bootstrap.py scripts/cloud_demo.py scripts/load_test.py scripts/worker_failure_demo.py
      - run: pytest tests/cloud -q
      - run: python scripts/bootstrap.py
      - run: docker compose --env-file .env.cloud config --quiet
      - run: docker compose --env-file .env.cloud up --build --wait --scale worker=2
      - run: python scripts/cloud_demo.py
      - if: always()
        run: docker compose --env-file .env.cloud logs --no-color
      - if: always()
        run: docker compose --env-file .env.cloud down
