name: Cloud runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agents
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: agents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agents"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agents:ci-password@localhost:5432/agents
      AGENT_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.lock
      - run: pip install -r requirements-cloud.lock -r requirements-cloud-dev.txt
      - run: ruff check --config ruff-cloud.toml cloud shared/gemini_http.py tests/cloud scripts/bootstrap.py scripts/cloud_demo.py scripts/workflow_demo.py scripts/load_test.py scripts/worker_failure_demo.py
      - run: python -m pytest tests/cloud -q
      - name: Validate Kubernetes manifests
        run: kubectl kustomize deploy/kubernetes > /tmp/cloudcrew-kubernetes.yaml
      - name: Scan Kubernetes configuration
        run: docker run --rm -v "$PWD/deploy:/scan/deploy:ro" aquasec/trivy:0.76.1 config --exit-code 1 --severity HIGH,CRITICAL /scan/deploy
      - run: python scripts/bootstrap.py
      - run: docker compose --env-file .env.cloud config --quiet
      - run: docker compose --env-file .env.cloud up --build --wait
      - name: Scan application image
        run: docker run --rm aquasec/trivy:0.76.1 image --ignore-unfixed --exit-code 1 --severity CRITICAL multi-agent-cloud:local
      - run: python scripts/cloud_demo.py
      - run: python scripts/workflow_demo.py --workflows 2
      - if: always()
        run: |
          if [[ -f .env.cloud ]]; then
            docker compose --env-file .env.cloud logs --no-color || true
          else
            echo "Skipping container logs because bootstrap did not create .env.cloud."
          fi
      - if: always()
        run: |
          if [[ -f .env.cloud ]]; then
            docker compose --env-file .env.cloud down --remove-orphans || true
          else
            echo "Skipping Compose cleanup because bootstrap did not create .env.cloud."
          fi
